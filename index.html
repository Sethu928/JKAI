<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J-KAI — Nexus</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #080808; color: #ff6a00; font-family: 'Courier New', monospace; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
#hud-top { background: #0d0d0d; border-bottom: 1px solid #ff6a0033; padding: 10px 20px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
#hud-logo { font-size: 20px; font-weight: 700; letter-spacing: 4px; }
.hud-dot { display: flex; align-items: center; gap: 6px; font-size: 10px; color: #ff6a0077; letter-spacing: 1px; }
.hud-dot-circle { width: 6px; height: 6px; border-radius: 50%; background: #ff6a00; }
.hud-status { display: flex; gap: 20px; }
#modules-bar { background: #0a0a0a; border-bottom: 1px solid #ff6a0022; padding: 6px 20px; display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
.mod { font-size: 10px; padding: 3px 12px; border: 1px solid #ff6a0033; color: #ff6a0055; border-radius: 3px; letter-spacing: 1px; }
.mod.on { border-color: #ff6a00; color: #ff6a00; }
#main { display: flex; flex: 1; overflow: hidden; }
#sidebar { width: 180px; background: #0a0a0a; border-right: 1px solid #ff6a0022; padding: 14px; display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; }
.s-title { font-size: 9px; color: #ff6a0044; letter-spacing: 2px; margin: 8px 0 4px; border-bottom: 1px solid #ff6a0011; padding-bottom: 4px; }
.s-item { font-size: 11px; color: #ff6a0055; padding: 5px 8px; border-radius: 3px; }
.s-item.on { color: #ff6a00; border: 1px solid #ff6a0033; background: #ff6a0011; }
.s-stat { display: flex; justify-content: space-between; font-size: 10px; color: #ff6a0044; padding: 2px 0; }
.s-stat span { color: #ff6a0088; }
#chat-wrap { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
#messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
#messages::-webkit-scrollbar { width: 4px; }
#messages::-webkit-scrollbar-thumb { background: #ff6a0033; border-radius: 2px; }
.msg { display: flex; gap: 12px; align-items: flex-start; }
.msg-tag { font-size: 10px; min-width: 56px; padding-top: 3px; letter-spacing: 1px; flex-shrink: 0; }
.msg-tag.u { color: #ff6a0066; }
.msg-tag.j { color: #ff6a00; }
.msg-text { font-size: 13px; line-height: 1.7; padding: 8px 14px; border-radius: 4px; border: 1px solid #ff6a0022; background: #0f0f0f; color: #cc5500; max-width: 700px; }
.msg-text.u { background: transparent; border-color: #ff6a0011; color: #664422; }
#typing { display: none; font-size: 12px; color: #ff6a0055; padding: 0 20px 8px; letter-spacing: 2px; }
#input-row { background: #0a0a0a; border-top: 1px solid #ff6a0033; padding: 12px 20px; display: flex; gap: 10px; align-items: center; flex-shrink: 0; }
#input-prefix { font-size: 12px; letter-spacing: 1px; }
#user-input { flex: 1; background: #111; border: 1px solid #ff6a0033; color: #ff6a00; font-family: 'Courier New', monospace; font-size: 13px; padding: 8px 12px; border-radius: 4px; outline: none; }
#user-input:focus { border-color: #ff6a00; }
#btn-send { background: none; border: 1px solid #ff6a0044; color: #ff6a00; font-family: 'Courier New', monospace; font-size: 10px; letter-spacing: 2px; padding: 8px 16px; border-radius: 4px; cursor: pointer; }
#btn-send:hover { background: #ff6a0011; }
#btn-clear { background: none; border: 1px solid #ff6a0022; color: #ff6a0044; font-family: 'Courier New', monospace; font-size: 10px; letter-spacing: 2px; padding: 8px 12px; border-radius: 4px; cursor: pointer; }
#btn-clear:hover { color: #ff6a00; }
#intro { position: absolute; inset: 0; background: #080808; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; transition: opacity 0.8s; }
#intro-logo { font-size: 64px; font-weight: 700; letter-spacing: 16px; color: #ff6a00; opacity: 0; transition: opacity 1s; }
#intro-bar-wrap { width: 300px; height: 2px; background: #1a1a1a; margin-top: 32px; border-radius: 2px; overflow: hidden; }
#intro-bar { height: 100%; width: 0%; background: #ff6a00; transition: width 2.5s ease; }
#intro-text { font-size: 11px; letter-spacing: 3px; color: #ff6a0066; margin-top: 16px; }
</style>
</head>
<body>

<div id="intro">
  <div id="intro-logo">J-KAI</div>
  <div id="intro-bar-wrap"><div id="intro-bar"></div></div>
  <div id="intro-text">INITIALISATION DU NEXUS...</div>
</div>

<div id="hud-top">
  <div id="hud-logo">J-KAI</div>
  <div class="hud-status">
    <div class="hud-dot"><div class="hud-dot-circle"></div> NEXUS ONLINE</div>
    <div class="hud-dot"><div class="hud-dot-circle"></div> MÉMOIRE ACTIVE</div>
  </div>
  <div style="font-size:10px; color:#ff6a0044; letter-spacing:2px;">SETHU // NEXUS v1.0</div>
</div>

<div id="modules-bar">
  <div class="mod on">J-KAI</div>
  <div class="mod on">MARC</div>
  <div class="mod">KAÏA</div>
  <div class="mod on">CORTEX</div>
  <div style="margin-left:auto; font-size:14px; color:#ff6a0033; border:1px solid #ff6a0022; padding:2px 10px; border-radius:3px;">ø</div>
</div>

<div id="main">
  <div id="sidebar">
    <div class="s-title">SYSTÈME</div>
    <div class="s-item on">NEXUS CORE</div>
    <div class="s-item">MÉMOIRE</div>
    <div class="s-item">LOGS</div>
    <div class="s-title">STATS</div>
    <div class="s-stat">Mémoire <span>∞</span></div>
    <div class="s-stat">Mode <span>LIBRE</span></div>
    <div class="s-title">PROJETS</div>
    <div class="s-item on">J-KAI</div>
    <div class="s-item">SNACK'N'SIP</div>
    <div class="s-item">NEXUS VR</div>
  </div>

  <div id="chat-wrap">
    <div id="messages"></div>
    <div id="typing">J-KAI &gt; traitement en cours...</div>
    <div id="input-row">
      <div id="input-prefix">SETHU &gt;</div>
      <input id="user-input" type="text" placeholder="Entrez votre commande..." autocomplete="off" />
      <button id="btn-clear">EFFACER</button>
      <button id="btn-send">ENVOYER</button>
    </div>
  </div>
</div>

<script>
const API = "http://127.0.0.1:5000";

async function sendMessage() {
  const input = document.getElementById("user-input");
  const msg = input.value.trim();
  if (!msg) return;
  input.value = "";
  addMessage("SETHU >", msg, "u");
  document.getElementById("typing").style.display = "block";
  try {
    const res = await fetch(API + "/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: msg })
    });
    const data = await res.json();
    document.getElementById("typing").style.display = "none";
    addMessage("J-KAI >", data.reply, "j");
  } catch(e) {
    document.getElementById("typing").style.display = "none";
    addMessage("J-KAI >", "Erreur de connexion au Nexus.", "j");
  }
}

function addMessage(tag, text, type) {
  const box = document.getElementById("messages");
  const div = document.createElement("div");
  div.className = "msg";
  div.innerHTML = '<div class="msg-tag ' + type + '">' + tag + '</div><div class="msg-text ' + type + '">' + text + '</div>';
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

async function loadHistory() {
  try {
    const res = await fetch(API + "/history");
    const data = await res.json();
    data.forEach(function(m) {
      if (m.role === "user") addMessage("SETHU >", m.content, "u");
      else if (m.role === "assistant") addMessage("J-KAI >", m.content, "j");
    });
  } catch(e) {}
}

document.getElementById("btn-send").addEventListener("click", sendMessage);
document.getElementById("user-input").addEventListener("keydown", function(e) {
  if (e.key === "Enter") sendMessage();
});
document.getElementById("btn-clear").addEventListener("click", async function() {
  await fetch(API + "/clear", { method: "POST" });
  document.getElementById("messages").innerHTML = "";
});

const intro = document.getElementById("intro");
const logo = document.getElementById("intro-logo");
const bar = document.getElementById("intro-bar");

setTimeout(function() { logo.style.opacity = "1"; }, 300);
setTimeout(function() { bar.style.width = "100%"; }, 600);
setTimeout(function() { intro.style.opacity = "0"; }, 3200);
setTimeout(function() { intro.style.display = "none"; loadHistory(); }, 4000);
</script>
</body>
</html>
